# Publishes the built site/ folder to GitHub Pages on every push to main.
# The pages are generated locally (npm run build) and committed, so this only
# uploads them. The preview is kept out of search engines: the real address is
# innomate-tech.com, and this copy still carries placeholders.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Mark the preview noindex
        run: |
          find site -name '*.html' -exec sed -i 's|<meta charset="utf-8">|<meta charset="utf-8">\n<meta name="robots" content="noindex, nofollow">|' {} +
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
